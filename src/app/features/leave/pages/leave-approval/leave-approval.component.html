<h2>Leave Requests</h2>

<table mat-table [dataSource]="leaves()">

  <ng-container matColumnDef="employeeId">
    <th mat-header-cell *matHeaderCellDef>Employee Id</th>
    <td mat-cell *matCellDef="let leave">{{ leave.employeeId }}</td>
  </ng-container>

  <ng-container matColumnDef="employeeName">
    <th mat-header-cell *matHeaderCellDef>Employee</th>
    <td mat-cell *matCellDef="let leave">{{ leave.employeeName }}</td>
  </ng-container>

  <ng-container matColumnDef="startDate">
    <th mat-header-cell *matHeaderCellDef>Start Date</th>
    <td mat-cell *matCellDef="let leave">{{ leave.from }}</td>
  </ng-container>

  <ng-container matColumnDef="endDate">
    <th mat-header-cell *matHeaderCellDef>End Date</th>
    <td mat-cell *matCellDef="let leave">{{ leave.to }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let leave">
     <span [ngClass]="leave.status">{{leave.status}}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let leave">
      <button
        mat-button
        color="primary"
        *ngIf="leave.status === 'pending'"
        (click)="approve(leave.id)"  [disabled]="leave.status !== 'pending'">
        Approve
      </button>

      <button
        mat-button
        color="warn"
        *ngIf="leave.status === 'pending'"
        (click)="reject(leave.id)"  [disabled]="leave.status !== 'pending'">
        Reject
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>
