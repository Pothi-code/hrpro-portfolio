<div>
    <h2>Employees</h2>
    <button mat-raised-button color="primary" routerLink="/employees/create">Add Employee</button>
    <form [formGroup]="searchForm">
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput formControlName="search" placeholder="Search employees">
    </mat-form-field>
  </form>
</div>
<table mat-table [dataSource]="store.employees()">
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{element.id}}</td>
    </ng-container>
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{element.name}}</td>
    </ng-container>
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{element.email}}</td>
    </ng-container>
    <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let element">{{element.role}} </td>
    </ng-container>
    <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let element">{{element.department}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
            <button mat-button color="primary" [routerLink]="['/employees/edit',element.id]">Edit</button>
            <button mat-button color="warn" (click)="delete(element.id)">Delete</button>
        </td>
    </ng-container>
    
     <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [length]="store.totalRecords()" [pageSize]="store.limit()" [pageIndex]="store.pageIndex()"[pageSizeOptions]="[5,10,20]" showFirstLastButtons></mat-paginator>

<div *ngIf="loading()" style="text-align:center">
    <mat-spinner></mat-spinner>
</div>
