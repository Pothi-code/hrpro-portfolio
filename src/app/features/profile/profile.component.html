<form *ngIf="form" [formGroup]="form">
    <mat-tab-group>
        <mat-tab *ngFor="let section of sections" [label]="section.sectionName">
        <h3 class="section-title">{{section.sectionName}}</h3>
        <div class="section-fields">
             <app-dynamic-field
                *ngFor="let field of section.fields"
                [field]="field"
                [form]="form">
            </app-dynamic-field>
            
        </div>
    </mat-tab>
    </mat-tab-group>
    
    <button type="submit">Save</button>
</form>
